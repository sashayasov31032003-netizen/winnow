[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winnow"
version = "0.1.0"
description = "Winnow - открытый статистический пакет с рабочим процессом в духе SPSS"
readme = "README.md"
requires-python = ">=3.10"

# Ядро: только разрешительные лицензии (BSD/MIT/LGPL) -> свой код можно оставить закрытым.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
]

[project.optional-dependencies]
# PySide6 под LGPL - в отличие от PyQt6 (GPL/commercial).
gui = ["PySide6>=6.6"]
export = ["python-docx>=1.1", "openpyxl>=3.1"]
# ВНИМАНИЕ: см. раздел о лицензиях в README.
dev = ["pytest>=8.0"]

[project.gui-scripts]
winnow = "winnow.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
