[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winnow"
version = "0.2.0"
description = "Winnow - открытый статистический пакет с рабочим процессом в духе SPSS"
readme = "README.md"
requires-python = ">=3.10"

# Ядро: только разрешительные лицензии (BSD/MIT/LGPL) -> свой код можно оставить закрытым.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
]

[project.optional-dependencies]
export = ["python-docx>=1.1", "openpyxl>=3.1"]
# ВНИМАНИЕ: см. раздел о лицензиях в README.
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
